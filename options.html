<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peekturn settings</title><link rel="stylesheet" href="src/options.css"></head>
<body><main>
  <header><img src="icons/icon48.png" alt="" width="48" height="48"><h1>Peekturn</h1></header>
  <form id="settings">
    <section><h2>Connection</h2>
      <label>Provider endpoint<input name="endpoint" type="url" required autocomplete="url" placeholder="https://api.deepseek.com"></label>
      <label>Model<input name="model" required autocomplete="off"></label>
      <label>API key<input name="apiKey" type="password" autocomplete="off" spellcheck="false"></label>
      <button type="button" id="test" class="secondary">Test connection</button>
    </section>
    <section><h2>Reading</h2>
      <div class="columns"><label>Explanation language<select name="language"><option value="en">English</option><option value="zh">简体中文</option></select></label>
      <label>Pronunciation accent<select name="accent"><option value="US">American English</option><option value="UK">British English</option></select></label></div>
      <button type="button" id="preview" class="secondary">Preview voice</button>
      <label class="check"><input name="autoPronounce" type="checkbox"> Automatically pronounce selections</label>
      <label class="check"><input name="merge" type="checkbox"> Merge caption cues into sentences</label>
    </section>
    <details><summary>Advanced prompts</summary>
      <label>English prompt<textarea name="promptEn" rows="7" spellcheck="false"></textarea></label><button type="button" class="secondary" data-reset="promptEn">Restore English default</button>
      <label>Chinese prompt<textarea name="promptZh" rows="7" spellcheck="false"></textarea></label><button type="button" class="secondary" data-reset="promptZh">Restore Chinese default</button>
    </details>
    <footer><button type="submit">Save settings</button><span id="status" role="status" aria-live="polite"></span></footer>
  </form>
</main><script type="module" src="src/options.js"></script></body></html>
